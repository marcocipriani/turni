<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: senza, env(safe-area-inset-*) vale zero e il padding
         che tiene la barra in basso sopra la tacca non fa niente. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- La barra di sistema segue le superfici dell'app, che sono neutre:
         la croma qui è riservata agli stati, e una barra blu sarebbe
         l'unico colore vivo dell'interfaccia senza dire niente.
         I valori sono --surface nei due temi, convertiti da OKLCH. -->
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/marchio/icona-192.png" />
    <link rel="apple-touch-icon" href="/marchio/icona-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Turni · sai sempre quando sei in sede, e con chi." />
    <title>Turni</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
